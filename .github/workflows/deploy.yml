name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ]; then
            echo "Error: DATABASE_URL secret is not set"
            echo "Please add DATABASE_URL to your GitHub repository secrets"
            exit 1
          fi
          if [ -z "${{ secrets.DIRECT_URL }}" ]; then
            echo "Error: DIRECT_URL secret is not set"
            echo "Please add DIRECT_URL to your GitHub repository secrets"
            exit 1
          fi
          echo "All required secrets are present"

      - name: Install dependencies
        run: npm ci
        working-directory: dashboard

      - name: Run database migrations
        run: npx prisma migrate deploy
        working-directory: dashboard

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --cwd dashboard --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build project
        run: vercel build --prod --cwd dashboard --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --cwd dashboard --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
